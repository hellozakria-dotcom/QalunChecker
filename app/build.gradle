plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qalun.checker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.qalun.checker'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'   // real phones only: keeps the APK small
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
